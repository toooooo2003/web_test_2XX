<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>快速啟動</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .shortcut-card {
      width: 100px;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background-color: #1e1e1e;
      color: #fff;
      transition: transform 0.2s;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    .shortcut-card:hover {
      transform: scale(1.05);
    }
    .shortcut-icon img {
      width: 32px;
      height: 32px;
    }
  </style>
</head>
<body class="bg-dark text-light">

<div class="container py-4">
  <div class="row g-3" id="shortcutContainer"></div>
</div>

<script>
  const sites = [
    { url: 'https://mail.google.com/mail/u/0/#inbox', title: 'Gmail' },
    { url: 'https://chatgpt.com/', title: 'ChatGPT' },
    { url: 'https://www.threads.com/', title: 'Threads' },
    { url: 'https://onedrive.live.com/?id=root&cid=551672E97E5242FF', title: 'OneDrive' },
    { url: 'https://www.youtube.com/', title: 'YouTube' },
    { url: 'https://instagram.com/', title: 'Instagram' },
    { url: 'https://www.tiktok.com/@chiawei_liu', title: 'TikTok' },
    { url: 'https://www.facebook.com/', title: 'Facebook' },
    { url: 'https://www.google.com/finance/portfolio/watchlist?hl=zh-TW', title: '股票' },
    { url: 'https://docs.google.com/spreadsheets/d/1rWVpOFGsrXDR7MUGf7Ov0dOXzI2f0sqYetw2zuklT7g/edit?gid=378907693#gid=378907693', title: '高股息買進殖利率' },
    { url: 'https://keep.google.com/', title: 'Keep' },
    { url: 'https://calendar.google.com/calendar/', title: 'Calendar' }
  ];

  const container = document.getElementById('shortcutContainer');

  sites.forEach(site => {
    const favicon = `https://besticon-demo.herokuapp.com/icon?url=${encodeURIComponent(site.url)}&size=32`;

    const card = document.createElement('div');
    card.className = 'col-auto';
    card.innerHTML = `
      <a href="${site.url}" target="_blank" rel="noopener noreferrer">
        <div class="shortcut-card">
          <div class="shortcut-icon">
            <img src="${favicon}" alt="${site.title} icon"
              onerror="this.onerror=null;this.src='https://via.placeholder.com/32?text=?'" />
          </div>
          <div>${site.title}</div>
        </div>
      </a>
    `;
    container.appendChild(card);
  });
</script>

</body>
</html>
