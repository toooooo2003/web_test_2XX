  <meta charset="UTF-8">
  <title>快速啟動</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 加這行讓手機響應式有效 -->
  <link href="http://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
<style>
  .shortcut-card {
    width: 100%;
    max-width: 100px;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
/*    background-color: #1e1e1e;*/
    color: #fff;
    transition: transform 0.2s;
    margin: 0 auto;
  }

  a {
    text-decoration: none;
  }

  .shortcut-card:hover {
    transform: scale(1.05);
  }

  .shortcut-icon {
    width: 64px;
    height: 64px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
    background-color: #ffffff;
    border-radius: 12px;
  }

  .shortcut-icon img {
    width: 60%;
    height: 60%;
    object-fit: contain;
  }

  .shortcut-card a,
  .shortcut-card a:visited {
    text-decoration: none;
    color: inherit;
  }


</style>


</head>
<body class="bg-dark text-light">



<div class="container py-4">

    const card = document.createElement('div');
    card.className = 'col-6 col-sm-auto';
    card.innerHTML = `
      <a href="${site.url}" target="_self">
        <div class="shortcut-card">

        </div>
      </a>
    `;
