<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>快速啟動</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 加這行讓手機響應式有效 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
<style>
  .shortcut-card {
    width: 100%;
    max-width: 100px;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
/*    background-color: #1e1e1e;*/
    color: #fff;
    transition: transform 0.2s;
    margin: 0 auto;
  }

  a {
    text-decoration: none;
  }

  .shortcut-card:hover {
    transform: scale(1.05);
  }

  .shortcut-icon {
    width: 64px;
    height: 64px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
    background-color: #1e1e1e;
    border-radius: 12px;
  }

  .shortcut-icon img {
    width: 60%;
    height: 60%;
    object-fit: contain;
  }

  .shortcut-card a,
  .shortcut-card a:visited {
    text-decoration: none;
    color: inherit;
  }

.weather-container {
  max-width: 100%;
  overflow: hidden;
}
.weather-container iframe {
  width: 100% !important;
}

.weather-container {
  margin-left: auto;
  margin-right: auto;
  margin-left: -46px;
}

</style>


</head>
<body class="bg-dark text-light">



<div class="container py-4">



  <div class="row g-3" id="shortcutContainer">
    <!-- JavaScript 會自動插入卡片 -->
  </div>

<div class="weather-container mb-4">
  <a class="weatherwidget-io"
     href="https://forecast7.com/en/23d70120d96/taiwan/"
     data-label_1="taipei"
     data-label_2="WEATHER"
     data-days="7"
     data-theme="dark"
     data-basecolor="transparent">
     taipei WEATHER
  </a>
</div>

</div>

<script>
  const sites = [


{ url: 'https://tw.piliapp.com/facebook-symbols/', title: '表情符號',icon:'https://cdn-icons-png.flaticon.com/512/6389/6389792.png' },

    { url: 'https://mail.google.com/mail/u/0/#inbox', title: 'Gmail' },
    { url: 'https://chatgpt.com/', title: 'ChatGPT', icon: 'https://cdn-icons-png.freepik.com/512/11865/11865313.png' },
    { url: 'https://www.threads.com/', title: 'Threads' },
    { url: 'https://onedrive.live.com/?id=root&cid=551672E97E5242FF', title: 'OneDrive',icon:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Microsoft_Office_OneDrive_%282019%E2%80%93present%29.svg/1280px-Microsoft_Office_OneDrive_%282019%E2%80%93present%29.svg.png' },
    { url: 'https://www.youtube.com/', title: 'YouTube', icon: '' },
    { url: 'https://instagram.com/', title: 'Instagram' },
    { url: 'https://www.tiktok.com/@chiawei_liu', title: 'TikTok' },
    { url: 'https://www.facebook.com/', title: 'Facebook' },
    { url: 'https://www.google.com/finance/portfolio/watchlist?hl=zh-TW', title: '股票', icon: 'https://static.wikia.nocookie.net/logopedia/images/8/84/Google_Finance_2020.png' },
    { url: 'https://docs.google.com/spreadsheets/d/1rWVpOFGsrXDR7MUGf7Ov0dOXzI2f0sqYetw2zuklT7g/edit?gid=378907693#gid=378907693', title: '高股息買進殖利率', icon: 'https://cdn-icons-png.freepik.com/512/2965/2965327.png' },
    { url: 'https://keep.google.com/', title: 'Keep', icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBFZtY1372KSCO390_b35v07umMAQDlyBYnDWi6wydnLYNQEm5XN8t11H9tlWOvAD86MQ' },
    { url: 'https://calendar.google.com/calendar/u/0/r', title: 'Calendar', icon: 'https://static.wikia.nocookie.net/logopedia/images/2/2a/Google_Calendar_2020-1.svg' }
  ];

  const container = document.getElementById('shortcutContainer');

  sites.forEach(site => {
    const domain = new URL(site.url).hostname.replace('www.', '');
    const icon = site.icon || `https://icons.duckduckgo.com/ip3/${domain}.ico`;

    const card = document.createElement('div');
    card.className = 'col-6 col-sm-auto';
    card.innerHTML = `
      <a href="${site.url}" target="_self">
        <div class="shortcut-card">
          <div class="shortcut-icon">
            <img src="${icon}" alt="${site.title} icon">
          </div>
          <div>${site.title}</div>
        </div>
      </a>
    `;
    container.appendChild(card);
  });
</script>


</body>
</html>
