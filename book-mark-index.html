
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>快速啟動</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 加這行讓手機響應式有效 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
<style>
  .shortcut-card {
    width: 100%;
    max-width: 100px;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
/*    background-color: #1e1e1e;*/
    color: #fff;
    transition: transform 0.2s;
    margin: 0 auto;
  }

  a {
    text-decoration: none;
  }

  .shortcut-card:hover {
    transform: scale(1.05);
  }

  .shortcut-icon {
    width: 64px;
    height: 64px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
    background-color: #1e1e1e;
    border-radius: 12px;
  }

  .shortcut-icon img {
    width: 60%;
    height: 60%;
    object-fit: contain;
  }

  .shortcut-card a,
  .shortcut-card a:visited {
    text-decoration: none;
    color: inherit;
  }


</style>


</head>
<body class="bg-dark text-light">



<div class="container py-4">



  <div class="row g-3" id="shortcutContainer">
    <!-- JavaScript 會自動插入卡片 -->
  </div>



</div>

<script>
  const sites = [


{ url: 'https://tw.piliapp.com/facebook-symbols/', title: '表情符號',icon:'img/6389792.png' },

    { url: 'https://mail.google.com/mail/u/0/#inbox', title: 'Gmail' },
    { url: 'https://chatgpt.com/', title: 'ChatGPT', icon: 'img/11865313.png' },
    { url: 'https://www.threads.com/', title: 'Threads' },
    { url: 'https://onedrive.live.com/?id=root&cid=551672E97E5242FF', title: 'OneDrive',icon:'img/oneDrive.png' },
    { url: 'https://www.youtube.com/', title: 'YouTube', icon: 'img/youtube.com.png' },
    { url: 'https://instagram.com/', title: 'Instagram',icon: 'img/instagram.com.png' },
    { url: 'https://www.tiktok.com/@chiawei_liu', title: 'TikTok',icon: 'img/tiktok.com.png' },
    { url: 'https://www.facebook.com/', title: 'Facebook' },
    { url: 'https://www.google.com/finance/portfolio/watchlist?hl=zh-TW', title: '股票', icon: 'img/Google_Finance_2020.png' },
    { url: 'https://docs.google.com/spreadsheets/d/1rWVpOFGsrXDR7MUGf7Ov0dOXzI2f0sqYetw2zuklT7g/edit?gid=378907693#gid=378907693', title: '高股息買進殖利率', icon: 'img/2965327.png' },
    { url: 'https://keep.google.com/', title: 'Keep', icon: 'img/images.png' },
    { url: 'https://calendar.google.com/calendar/u/0/r', title: 'Calendar', icon: 'img/Google_Calendar_2020-1.png' }
  ];

  const container = document.getElementById('shortcutContainer');

  sites.forEach(site => {
    const domain = new URL(site.url).hostname.replace('www.', '');
    const icon = site.icon || `https://icons.duckduckgo.com/ip3/${domain}.ico`;

    const card = document.createElement('div');
    card.className = 'col-6 col-sm-auto';
    card.innerHTML = `
      <a href="${site.url}" target="_self">
        <div class="shortcut-card">
          <div class="shortcut-icon">
            <img src="${icon}" alt="${site.title} icon">
          </div>
          <div>${site.title}</div>
        </div>
      </a>
    `;
    container.appendChild(card);
  });
</script>


</body>
</html>
